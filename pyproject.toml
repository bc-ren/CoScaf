[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coscaf"
version = "0.1.0"
description = "Adapting in Concert: Recognizing the Unseen via Semantic Scaffolding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "torch>=2.5.1",
  "Pillow>=10.4",
  "transformers==5.13.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]
retina = ["torchvision>=0.17"]

[project.scripts]
coscaf = "coscaf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
